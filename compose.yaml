services:
  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: coach_foot_php
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    depends_on:
      - database

  nginx:
    image: nginx:1.27-alpine
    container_name: coach_foot_nginx
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  database:
    image: mysql:8.0
    container_name: coach_foot_database
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: coach_foot
      MYSQL_USER: app
      MYSQL_PASSWORD: app
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: coach_foot_phpmyadmin
    environment:
      PMA_HOST: database
      PMA_USER: root
      PMA_PASSWORD: root
    ports:
      - "8081:80"
    depends_on:
      - database

volumes:
  mysql_data: